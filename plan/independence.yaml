# 독립 평가 절차 — 무엇이 노출됐고, 무엇을 평가로 인정할 것인가
#
# `plan/experiments.yaml` 은 "무엇을 어떻게 잴 것인가" 다. 이 파일은 그 앞에
# 서는 질문이다 — **이미 본 것을 안 본 것처럼 쓰지 않으려면 무엇을 고정해야
# 하는가.** `remeasure.yaml` 의 `write-block-eval` 이 "미측정" 으로 비워 둔 칸을
# 어떤 절차로 채울 수 있는지가 여기 있다.
#
# 이 파일이 필요한 이유는 하나다. 게시 문서 헤드라인 칸에 붙은 **개발용 계열**
# 표기는 게시 제한이고 원인 해결이 아니다(`README.md` · `HARDENING.md` 의
# 2026-09-10 정정). 원인은 "같은 경계를 재는 eval 계열이 없다" 이고, 그 계열을
# 만들려면 먼저 **무엇이 노출됐는지**와 **무엇을 평가로 인정할지**를 정해야 한다.
#
# ## 이 파일은 실행 명령이 아니다
#
# 아래에 명령이 적혀 있지만 여기서 돌리지 않는다. 이번 회차의 유료 실험 예산은
# 0 이고 모델 호출은 한 번도 안 나갔다. 확인은 전부 오프라인이다
# (`meta.offline_checks`).
#
# ## 쓰는 말
#
#   노출(exposure)  그 계열·메커니즘의 결과가 사람 또는 도구에 닿은 정도. 세 갈래
#   동결(freeze)    평가에 쓰는 파일 집합을 커밋으로 못 박는 것. git 이 해시다
#   봉인(seal)      사람이 "이 커밋부터 이 계열은 eval" 이라고 선언하는 것
#   교정(calibrate) 센서가 발화하는지 개발용 사례로 확인하는 것. 평가가 아니다

meta:
  written: "2026-09-10"
  agent: claude-code
  parent: plan/experiments.yaml
  registry: remeasure.yaml · write-block-eval
  seal_table: dataset/schema.md · 봉인 규칙
