  note: null

- id: probe_persistence_flag.py
  role: 게시근거
  writes: "persistence-flag.json"
  ledger: true
  published: --no-session-persistence 단독 효과
  note: >-
    2026-09-10 까지 **임포트조차 안 됐다** — 참조하던 `BUILD` 가 상류에서
    사라졌는데 이 파일이 안 따라갔다. 상수를 케이스 setup 에서 뽑도록 고쳤다.
    그 동안 이 프로브는 돌 수 없었으므로 게시 값의 재측정은 여전히 미해결이다.

- id: probe_session_consistency.py
