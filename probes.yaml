# 프로브 등록부 — **유료 회차를 태우는 진입점 전수**
#
# `remeasure.yaml` 은 "다시 재야 하는 **값**" 의 목록이고, 이 파일은 "회차를
# 태우는 **파일**" 의 목록이다. 둘은 다른 축이라 한 파일에 못 넣는다 —
# `check_docs.py` 의 등록부 검사가 `remeasure.yaml` 의 항목마다 "그 명령이
# 부르는 프로브가 결과 파일을 쓰는가" 를 보는데, 진단 전용 프로브는 결과
# 파일을 안 쓰는 것이 **정상**이라 같은 목록에 있으면 전부 오류가 된다.
#
# 왜 이 파일이 필요한가. 지금까지 "어느 프로브가 게시된 수치를 낳았나" 는
# 사람의 기억이었다. 손으로 센 목록이 실제로 틀렸다 — 콘솔 전용 프로브를 11 개로
# 세었는데 모델을 부르는 진입점은 그보다 많았고, 빠진 것 중에는 임포트만 해도
# 회차가 나가는 파일이 있었다(`repro_exec_rate.py`, 2026-09-10 에 호출 8 건 유출 —
# 종료 7 건 $0.496967, 미완 1 건 과금 미확정).
# 그래서 목록을 손이 아니라 **코드가 만들게** 한다: `runner.probe_registry_gaps()`
# 가 `*.py` 를 훑어 유료 호출 표식을 가진 파일을 뽑고 이 파일의 `id` 집합과
# 대조한다. `runner.py selftest` 가 매번 돌린다.
#
# ## 필드
#
#   id        파일 이름. 이것이 열쇠다
#   role      게시근거 | 진단전용 | 미분류
#             게시근거  게시 문서(README · README.en · HARDENING · artifact ·
#                       docs/ · writeup/)에 이 프로브에서 나온 수치가 서 있다
#             진단전용  사람이 원인을 보려고 돌린다. 어떤 수치도 게시 안 됨
#             미분류    **결정할 근거가 없다.** 임시 상태이고 게시를 제한한다.
#                       조사로 못 정하면 사람에게 넘긴다 — 임의로 진단전용에
#                       밀어 넣으면 게시된 값이 검증 대상에서 빠진다
#   writes    이 프로브가 쓰는 결과 파일 glob. 안 쓰면 null
#   ledger    회차가 `runner` 장부(run-log/*-ledger.jsonl)에 남는가
#             true       call_agent 또는 runner.run_case 를 거친다
#             false      아직 안 배선. 회차가 장부에 안 남는다
#   published 게시된 수치가 있으면 어디인가. 없으면 null
#   note      왜 이 분류인가
#
# ## 규율
#
# `role: 게시근거` 인데 `writes: null` 이면 **그 수치는 원시에 못 묶인다.**
# 지우는 것이 아니라(규칙 2) 게시 쪽에 철회·제한 표기를 달고
# `remeasure.yaml` 에 올린다. 이 파일은 그 사실을 드러내는 자리이지 고치는
# 자리가 아니다.
#
# `ledger: true` 라도 장부는 결과 파일을 대신하지 않는다. 장부는 "무엇을 언제
# 몇 회차 태웠나" 이고 결과 파일은 "그 축에서 무엇이 나왔나" 다. 게시 수치는
# 여전히 결과 파일에 묶여야 한다.

# ── 게시근거 · 결과 파일 있음 ────────────────────────────────────────
- id: wsl_probe.py
  role: 게시근거
  writes: "wsl*-<case>-<mode>-<구분자>.json"
  ledger: true
  published: 회귀표 헤드라인 칸 (remeasure.yaml write-block-60)
  note: >-
    샤드를 이어 붙여 목표 회차를 채운다. 버전을 파일 안에 싣고 다른 버전 샤드를
    분모에서 뺀다. 잠금으로 같은 칸의 동시 실행을 막는다.

- id: probe_read.py
  role: 게시근거
  writes: "read-grid-<꼬리표>.json · read-raw-<꼬리표>.jsonl"
  ledger: true
  published: 읽기 그리드 (README 1절 표의 읽기 두 행)
  note: 꼬리표가 플랫폼·모델 축이라 같은 축을 다시 돌리면 덮인다(check_docs EXEMPT).

- id: probe_hardening.py
  role: 게시근거
  writes: "hardening-<팔>-<모델>-<구분자>.json"
  ledger: true
  published: 7절 거부 목록 표 (remeasure.yaml names-leak-rate)
  note: 옛 고정 이름이 세 팔을 한 파일로 덮어써서 원시를 잃었다. 이름은 고쳐졌고 회차 예산만 남았다.

- id: probe_proxy.py
  role: 게시근거
  writes: "proxy-check.json · proxy-mask.json · proxy-replaces<-꼬리표>.json · proxy-axis<-꼬리표>.json"
  ledger: true
  published: 프록시 절 · 회귀 측정 ③ (remeasure.yaml proxy-axis-2x2)
  note: axis 가 네 팔을 한 스크립트에서 교대로 돈다. 팔이 갈리면 스킴·설정까지 같이 갈린다.

- id: probe_credentials.py
  role: 게시근거
  writes: "cred-<팔>-<구분자>.json · cred-partial-<팔>.json"
  ledger: true
  published: 자격증명 절
  note: 중간 스냅샷(cred-partial-*)은 결과가 아니라 진행 상태다.

- id: probe_credguard.py
  role: 게시근거
  writes: "credguard.json"
  ledger: true
  published: 자격증명 보호 설정 절
  note: null

- id: probe_bash_needed.py
  role: 게시근거
  writes: "bashneed-<팔>-<구분자>.json · bashneed-partial-<팔>.json"
  ledger: true
  published: Bash 필요 조건 절
  note: null

- id: probe_network.py
  role: 게시근거
  writes: "network-allowlist-modes.json · network-enabling-check.json"
  ledger: true
  published: 네트워크 절
  note: 한 판 = 한 파일(arms 배열)이라 실행 구분자가 면제돼 있다(check_docs EXEMPT).

- id: probe_deny_bash_chain.py
