  note: 조건 미성립이면 판정하지 않고 종료코드 2 로 끝난다.

- id: wsl_probe_failopen.py
  role: 게시근거
  writes: "failopen-<팔>-<구분자>.json"
  ledger: true
  published: 1절 셋째 행 (remeasure.yaml fail-open-rate — 철회됨)
  note: >-
    게시된 10/10 을 지탱할 원시가 없어 철회됐다. 프로브는 이제 팔마다 파일을
    쓰고 예정·시작·유효·미시도·판정불가·fail-open 을 따로 센다.

# ── 게시근거 · 파일 쓰기가 방금 들어갔고 **아직 안 돌았다** ──────────
# 넷 다 2026-09-10 까지 콘솔에만 냈다. 이제 결과 파일을 쓰지만 디스크에는
# 아직 0 건이다 — 게시된 값은 여전히 원시에 못 묶인다. 파일 이름을 만든 것과
# 값을 되살린 것은 다르다. 되살리려면 회차 예산이 필요하고, 그 등록은
# `remeasure.yaml` 담당이다.
- id: probe_path_naming.py
  role: 게시근거
  writes: "pathnaming-<접두사>-<구분자>.json"
  ledger: true
  published: >-
    README.md 3절 2x3 표(고지·중립 `sonnet` 칸) · LOG.md 의 7/30 = 0.233 대 1.000 ·
    remeasure.yaml pathcue-announced-sonnet · remeasure.yaml pathcue-neutral-sonnet
  note: >-
    **게시된 값 자체는 아직 원시가 없다** — 파일 쓰기는 2026-09-10 에 들어갔고
    그 뒤로 한 번도 안 돌았다. 이 값 하나가 구 3절 재범위화와 구 4절 철회
    양쪽의 하중이라 재측정 없이는 두 처리 모두 근거가 없다.
    이 프로브는 장부만으로 갈리지 않는다 — 두 팔이 케이스·모드·모델까지 같고
    다른 것은 temp 접두사 하나뿐이라 자기 결과 파일이 반드시 필요하다.
    2026-09-10: 그래서 3절 2x3 표의 네 칸을 「검증 가능한 원본 부재로 제외」로
    내렸다. 등록부에 항목이 생겼으므로 이제 8 번 검사가 그 칸들을 감시한다 —
    그 전에는 등록이 없어 **헤드라인 절의 표가 검사 밖에 있었다.**

- id: probe_model_axis.py
  role: 게시근거
  writes: "modelaxis-<모델>-<구분자>.json"
  ledger: true
  published: >-
    README.md 3절 2x3 모델축 표 · artifact/results.html 의 같은 표 ·
    remeasure.yaml pathcue-announced-others · remeasure.yaml pathcue-neutral-others ·
    remeasure.yaml pathcue-neutral-pooled
  note: >-
    중립 경로 칸(30/30 · 20/21)은 이 프로브에서만 나올 수 있다. 파일 쓰기는
    2026-09-10 에 들어갔고 **아직 안 돌았다** — 게시된 값의 원시는 여전히 없다.
    고지 칸 29/82 는 세 세션 통합이고 세 판 모두 원시가 없다.
    **고지 칸 18/18 은 출처까지 어긋난다** — 이 파일의 `ORIG` 상수는
    haiku (10,10) · opus (10,10) 이라 합이 20/20 인데, 게시된 값은 docs/90
    「통합 표본」 표의 18/18 이다. 통합이 분모를 줄일 수는 없다. 원시가 없어
    어느 쪽이 맞는지 못 가리므로 **두 값 중 하나를 골라 적지 않았다.**
    2026-09-10: 네 칸 모두 게시 문서에서 제외 표기로 내려갔다.

