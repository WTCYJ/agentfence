  note: 심링크 통과 회차의 대안 배제. 위와 같은 이유로 미분류. 버전 고정 결함은 고쳤다.

# ── 간접 진입점 · 다른 담당 ──────────────────────────────────────────
- id: campaign.py
  role: 진단전용
  writes: "campaign-status.json (결과가 아니라 진행 상태)"
  ledger: true
  published: null
  note: >-
    `smoke()` 가 픽스처×모드 조합마다 `probe_credentials.one_run` 을 한 회차씩
    실제로 태운다. 그 회차는 `campaign-status.json` 에도 안 들어가지만
    `one_run` 이 `call_agent` 를 거치므로 **장부에는 남는다.** 이 파일 자체는
    이번 담당 범위 밖이라 팔 이름만 상류에서 붙는다.

- id: check_mask_warn.py
  role: 미분류
  writes: "mask-warn-channel.json"
  ledger: true
  published: 마스킹 경고 채널 절
  note: >-
    2026-09-10 에 배선했다. 그 전에는 `subprocess.run` 을 직접 불러 회차가
    장부에도 안 남고 승인·예산 관문도 안 지났다 — 관문을 한 지점에 두는데
    그 지점을 비껴가는 파일이 남아 있으면 관문이 아니다. 지금은
    `runner.call_agent(cmd, arm=label, ...)` 를 지난다.

- id: check_positive_signal.py
  role: 미분류
  writes: "positive-signal<-꼬리표>.json"
  ledger: true
  published: 양성 신호 절
  note: >-
    위와 같다. 2026-09-10 에 `runner.call_agent(cmd, arm="positive-signal", ...)`
    로 배선했다. `--version` 조회는 유료 회차가 아니라 그대로 둔다.
