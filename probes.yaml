  note: >-
    README 가 이미 "회차 JSON 도 안 남긴다" 는 제한을 달았다. 파일 쓰기는
    2026-09-10 에 들어갔고 아직 안 돌았다. **원인 하나는 그대로다** — 이 프로브는
    `--settings` 를 안 넘겨 샌드박스가 꺼진 조건이고, 같은 표의 Bash 경유 행과
    조건이 다르다. 게이트를 넣으면 재는 대상이 바뀌므로 측정 설계 결정이다.
    지금은 그 사실을 결과 파일 안(`settings_note`)에 싣기만 했다.

