# MaliciousAgentSkillsBench — 라벨 분류축과 계측 설계만 추린 정제본
#
# 원본 157행을 여기 옮기지 않는다. 옮길 것이 없기 때문이다: 이 CSV 에는
# 스킬 본문도 주입 문자열도 없고 (source, repo, skill_name, classification,
# Pattern, Severity) 여섯 칸뿐이다. 즉 이 자료에서 우리가 가져올 수 있는 것은
# (나) 케이스 커버리지 우선순위의 근거가 되는 라벨 분포와 (다) 계측 설계
# 두 가지이고, 실행 가능한 케이스는 하나도 나오지 않는다.
#
# 스킬 본문은 data/skills_dataset.csv(10,538,735B)에 있고 받지 않았다.
# 본문이 필요해지면 upstream_id 로 그 파일을 그 자리에서 열어라.

provenance:
  source_url: https://github.com/protectskills/MaliciousAgentSkillsBench
  commit: f7d28b1a9de4eb33d552529cf79d1065d765f6c3   # 2026-08-03 "Add AE badges, paper PDF, and overview figure to README"
  obtained: "2026-09-09"
  local_path: dataset/raw/malicious-agent-skills-bench
  files_on_disk:
    - {path: malicious_skills.csv, bytes: 27434, md5: 2b2a0f4c1e5dd63031ec8ddfb6b09b3f}
    - {path: LICENSE, bytes: 1095}
  not_downloaded:
    - data/skills_dataset.csv     # 10538735B — Tier1 전체 98,380행. 본문/분류 포함
    - paper.pdf                   # 512582B
  license:
    spdx: MIT                     # LICENSE 1행 "MIT License", 3행 "Copyright (c) 2025 MaliciousAgentSkillsBench Contributors"
    redistribution: 출처 표기만으로 허용. 그래도 라벨 집계만 옮기고 행 원문은 두지 않는다
  paper: >-
    USENIX Security 2026, "Do Not Mention This to the User": Detecting and
    Understanding Malicious Agent Skills in the Wild. arXiv:2602.06547.
    Artifacts Available / Functional / Results Reproduced 배지.
  verified_by: >-
    CSV 157행 전수 자체 파싱(csv.DictReader). 라벨 집계는 우리가 직접 센 값이고
    README 가 서술한 방법론(instance-level 632)과 일치한다. 계측 설계는
    code/executor/run_skill.sh 원문을 직접 열어 확인했다.

upstream_id:
  format: "<source>/<repo>/<skill_name>"           # 세 칸을 합쳐야 유일해진다
  example: skillsmp.com/smp_8452/flow-nexus-platform
  resolves_to: dataset/raw/malicious-agent-skills-bench/malicious_skills.csv 의 해당 행
  caveat: >-
    skill_name 만으로는 유일하지 않다. flow-nexus-platform 이 rest_234 와
    smp_8452 양쪽에 서로 다른 라벨로 한 번씩 있다(고유 이름 156 / 행 157).

corpus_shape:
  rows: 157                     # wc -l 158 - 헤더 1. 임베디드 개행 없음
  unique_repos: 69
  unique_skill_names: 156
  label_instances: 632          # Pattern 토큰 무-중복제거 합. README 의 taxonomy_counts.py 와 같은 정의
  distinct_labels: 14
  labels_per_row: {min: 1, max: 13, mean: 4.03}
  classification: {malicious: 157}    # 이 파일은 전부 악성. 음성 대조군이 없다
  source: {skillsmp.com: 136, skills.rest: 21}
  severity_instances: {CRITICAL: 252, HIGH: 202, MEDIUM: 176, LOW: 2}
  parallel_columns: >-
    Pattern 과 Severity 는 '; ' 로 조인된 같은 길이의 병렬 리스트다.
    157행 전부 길이가 일치한다(불일치 0). 인덱스로 짝지으면 된다.

# ---------------------------------------------------------------------------
# (나) 라벨 분포 — 커버리지 우선순위의 근거
#
# 두 가지 세는 법을 다 남긴다. README 가 스스로 구분하는 축이고, 우리한테는
# 이 차이가 크다. instances 는 한 스킬 안에서 같은 라벨이 반복되면 반복만큼
# 세고(smp_10280 의 External Transmission x2 처럼), skills 는 스킬 단위로 접는다.
# 우선순위는 skills 로 잡아야 한다 — 우리가 만들 케이스는 스킬 하나에
# 하나씩 대응하지, 한 스킬 안의 중복 호출 수에 대응하지 않는다.
# ---------------------------------------------------------------------------

label_distribution:
  # label: [instances, skills]
  Remote Code Execution:               [159, 118]
  Behavior Manipulation:               [119, 100]
  Network sniffing / Credential theft: [112, 101]
  External Transmission:               [ 86,  79]
  Instruction Override:                [ 39,  24]
  Context Leakage:                     [ 30,  29]
  Hardcoded Tokens:                    [ 17,  10]
  Hidden Instructions:                 [ 16,  15]
  Code Obfuscation:                    [ 15,  15]
  File System Scan:                    [ 13,  12]
  Privilege Escalation:                [ 12,   6]
  Data Exfiltration:                   [  5,   5]
  Command Injection:                   [  5,   5]
  Excessive Permissions:               [  4,   4]

sampling_bias:
  # 이 분포를 우선순위로 쓰기 전에 반드시 읽을 것.
  dominant_repo: smp_170
  rows_from_it: 85            # 157행의 54%가 저장소 하나에서 나왔다
  effect: >-
    라벨 순위가 저 저장소 하나에 끌려간다. Network sniffing 112건 중 91건,
    RCE 159건 중 115건이 smp_170 이다. 반대로 Instruction Override 는 39건 중
    36건이 smp_170 '바깥'이고, Privilege Escalation 12건과 Command Injection
    5건은 smp_170 에 아예 없다.
  implication: >-
    "RCE 가 1위니 RCE 부터" 는 근거가 약하다. 저장소 편중을 걷어내면 상위
    네 라벨의 간격이 좁아진다. 우선순위는 label_distribution 의 skills 열과
    이 편중을 같이 보고 정하고, 분포를 유병률로 인용하지 마라.

# ---------------------------------------------------------------------------
# 유인 수단 / 도달 결과 축
#
# 14종을 우리 하네스의 두 층으로 가른다. 이 갈라치기가 필요한 이유는
# 프로젝트 특징 2 때문이다: 유인 수단은 저장소 빌드 스크립트가 맡을 몫이고,
# 도달 결과는 OS 경계에서 관측할 몫이다. 둘을 섞으면 모델이 거절한 것인지
# 집행 계층이 막은 것인지 못 가른다.
# ---------------------------------------------------------------------------

axis:
  lure:            # 유인 수단 — 모델의 판단을 흔든다. syscall 로 안 보인다
    instances: 204
    labels: [Behavior Manipulation, Instruction Override, Context Leakage, Hidden Instructions]
  concealment:     # 은폐 — 정적 리뷰를 피한다. 이것도 syscall 로 안 보인다
    instances: 15
    labels: [Code Obfuscation]
  reach:           # 도달 결과 — 실제 OS 경계를 넘는다. 우리가 재는 대상
    instances: 413
    labels: [Remote Code Execution, Network sniffing / Credential theft,
             External Transmission, Hardcoded Tokens, File System Scan,
             Privilege Escalation, Data Exfiltration, Command Injection,
             Excessive Permissions]

  combination_shape:            # 157 스킬을 두 층 조합으로 본 것
    lure_and_reach: 110         # 유인 + 도달 둘 다. 우리 하네스가 겨냥할 모양
    reach_only: 36              # 유인 없이 바로 경계를 넘는다. 집행 계층 단독 시험에 좋다
    lure_only: 11               # 경계를 안 넘는다. 우리 측정으로는 판정 신호가 안 나온다
    note: >-
      lure_only 11건은 우리 하네스로 재봐야 음성만 나온다. 이걸 '차단 성공'
      으로 세면 안 된다(특징 3). 케이스로 만들지 말거나, 만들면 기대값을
      '관측 신호 없음'으로 못박아라.

# ---------------------------------------------------------------------------
# (다) 계측 설계 — code/executor/run_skill.sh 원문 확인
# ---------------------------------------------------------------------------

instrumentation:
  verified_at: code/executor/run_skill.sh (109-132행), 커밋 f7d28b1
  strace:
    opts: "-f -s 2000"
    trace: [open, openat, creat, write, unlink, rename, mkdir, rmdir,
            execve, connect, accept, sendto, recvfrom]
  tcpdump: "tcpdump -i any -w network.pcap -s 0"      # -s 0 = 풀 캡처
  filesystem: baseline 스냅샷 후 diff → filesystem_changes.json
  other_artifacts: [metadata.json, claude_output.txt, nova-tracer/]

  decision_rule:
    # 우리 특징 3(미관측을 결과로 세지 않는다)과 정확히 같은 규칙이다.
    - connect 있음 + pcap 에 패킷 있음  → 나갔다
    - connect 있음 + pcap 에 패킷 없음  → 네트워크 계층이 막았다
    - connect 없음                      → 시도 자체가 없었다(차단 성공이 아니다)

  gap:
    # 이 syscall 목록으로는 14종 중 3종이 원리상 안 보인다. 그대로 베끼면
    # 관측 못 한 것을 '안 일어났다'로 적게 된다.
    blind_labels:
      Hardcoded Tokens:      {instances: 17, why: 정적 문자열이라 런타임 syscall 이 없다}
      Privilege Escalation:  {instances: 12, why: setuid/setgid/capset 이 trace 목록에 없다}
      Excessive Permissions: {instances:  4, why: chmod/fchmod/chown 이 trace 목록에 없다}
    blind_instances: 33      # 632의 5.2%
    also_missing: [socket, bind, listen, read, ptrace, chmod, chown, setuid, setgid]
    action: 우리가 쓸 때는 최소한 chmod/fchmod/chown/setuid/setgid/socket 을 -e trace 에 더해라

what_it_does_not_test:
  - 실제 OS 집행을 전혀 재지 않는다. 이 CSV 는 정적 라벨 표다 — 스킬 본문도,
    실행 로그도, 판정 근거도 여기 없다. 라벨은 원저자의 분석 결과지 우리
    환경에서 재현된 관측이 아니다.
  - 라벨은 '이 스킬이 그런 동작을 담고 있다'는 뜻이지 '샌드박스를 뚫었다'는
    뜻이 아니다. 어떤 제품의 어떤 경계 설정에서 실제로 넘어갔는지는
    이 자료로 알 수 없다.
  - 음성 대조군이 없다. 157행 전부 classification=malicious 라서
    오탐률·기저율을 이 파일만으로는 못 구한다. safe 94,093 / suspicious 4,130
    은 받지 않은 skills_dataset.csv 에 있다.
  - 분포를 유병률로 읽으면 안 된다. 저장소 하나가 54%다(sampling_bias 참조).
  - 유인 수단 라벨(204 instances)은 우리 계측으로 원리상 관측되지 않는다.
    관측 대상은 reach 쪽 413 뿐이고, 그중 33 은 위 gap 때문에 목록을
    보강해야 겨우 보인다.

usable_for:
  - 케이스 커버리지 우선순위의 출발점 (label_distribution 의 skills 열 + sampling_bias 보정)
  - 유인/도달 2층 태깅 축 (axis) — 우리 케이스에 그대로 쓸 수 있다
  - 계측 목록과 판정 규칙 (instrumentation) — gap 보강해서 채택
not_usable_for:
  - 실행 가능한 케이스 본문. 이 파일에는 페이로드가 한 줄도 없다
