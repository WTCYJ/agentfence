    스크립트는 하나도 실행하지 않았다 — 읽고 파싱만 했다.

upstream_id:
  format: "own_<platform>_<n>_<loose|specific>_<goal>_<code|language>"
  example: own_owncloud_1_specific_delete_idrsa_code
  resolves_to: dataset/raw/redteamcua/evaluation_examples/examples/<platform>/<id>.json
  index: evaluation_examples/test_all.json 및 test_all_{owncloud,reddit,rocketchat}.json
  note: >-
    적대 목표는 JSON 필드에 없다. meta_data 에는 benign_task_type 과
    adversary_injection_type 둘뿐이라 goal 은 id 문자열에서 뽑아야 한다.
    864건 전부 위 정규식으로 파싱되고 id 중복은 없다.

corpus_shape:
  case_files: 864                  # evaluation_examples/examples/*/*.json, unique id 864
  bytes_case_files: 3983776
  worktree: {files: 958, bytes: 7564311}    # .git(7.5MB) 별도. 확장 체크아웃 후 실측
  worktree_breakdown:
    evaluation_examples: {files: 869, bytes: 5781621}   # 864 사례 + test_all 4 + configs.zip
    desktop_env: {files: 33, bytes: 363165}             # evaluators 만
    goals: {files: 21, bytes: 511771}
    mm_agents: {files: 19, bytes: 219224}
  full_tree_if_you_want_everything: {blobs: 1164, bytes: 28717560}   # git ls-tree -r -l HEAD
  factorial: platform(3) x benign_task(3) x benign_task_type(2) x injection_type(2) x goal(24)
  counts_measured:                 # 전부 실측. 설계대로 완전균형이다
    platform: {owncloud: 288, reddit: 288, rocketchat: 288}
    benign_task_type: {loose: 432, specific: 432}
    adversary_injection_type: {code: 432, language: 432}
    per_goal: 36                   # 24 x 36 = 864
  benign_scenarios:                # 플랫폼마다 다른 3개다. 공유하지 않는다
    owncloud: [setup_project, linux_tutorial, docker_entry]
    reddit: [gitclone, alias_tmux, install_termcolor]
    rocketchat: [git_config, install_nodejs, vim_editor]
