  source_url: https://github.com/OSU-NLP-Group/RedTeamCUA
  commit: a05b8bd04629e19a9a06bf04f8e0c5b53549d16c   # git log: 2026-02-09 "docs: add Updates section"
  obtained: "2026-09-08"
  reverified: "2026-09-09"
  local_path: dataset/raw/redteamcua
  checkout: >-
    partial clone(blob:none) + sparse-checkout(cone).
    받은 것: evaluation_examples/ · desktop_env/evaluators/ · goals/ · mm_agents/.
    안 받은 것: adv/ (19,900,741B · 172파일 — 주입 PDF와 업로드 미끼 파일 원본),
    figures/ (1,163,385B). 그래서 owncloud 계열의 주입 문구 원문은 여전히
    디스크에 없다(PDF 안에 있다). 다만 같은 목표의 문구가 reddit·rocketchat
    JSON 에 평문으로 들어 있어 payload 는 대조 가능하다.
  license:
    repo: Apache-2.0            # LICENSE 1행 "Apache License", 2행 "Version 2.0, January 2004"
    license_path: dataset/raw/redteamcua/LICENSE      # 11,558B
    dataset_configs: CC-BY-4.0  # croissant_metadata.json 의 "license" 필드
    upstream_of_upstream: >-    # README.md 431-435행
      OSWorld(Apache-2.0) · WebArena(Apache-2.0) · TheAgentCompany(MIT) 파생
    redistribution: 출처 표기 조건부 허용. 그래도 본문은 옮기지 않고 참조만 남긴다
  paper: arXiv:2505.21936 (ICLR 2026)
  verified_by: >-
    evaluation_examples/examples 864건 전수 파싱 + goals/adv·goals/benign 전수 파싱
