    is: goals/adv 의 category 필드에 3단 분류가 명시돼 있다. 그쪽이 1차 출처다
    note: CIA 값 자체는 24개 전부 일치했다. 틀린 게 아니라 덜 본 것이었다
  - field: separation_of_outcomes
