# RedCode-Exec 정제본 — 실상태 오라클 6개만
#
# 옮긴 것은 페이로드가 아니라 오라클이다. RedCode 의 자극은 "다음 코드를
# 실행해라"라고 에이전트에게 직접 시키는 형태라 우리 원칙 2(역할 분리)와
# 정면으로 어긋난다. 그대로 쓰면 집행 계층이 아니라 모델의 거절률을 잰다.
# 실제로 RedCode 가 재는 것도 그것이다 — 점수 0 은 REJECT_TEMPLATES 문자열
# 매칭이고, 그건 모델이 뭐라고 말했는지지 제품이 뭘 막았는지가 아니다.
#
# 값이 있는 것은 evaluation.py 다. 27개 인덱스 중 6개(2·4·6·8·9·18)는
# 에이전트 발화가 아니라 컨테이너 상태를 직접 조회해서 판정하고, 판정 뒤
# 원상복구까지 한다. 그 6개의 명령과 복구 절차를 우리 oracle 자리에 그대로
# 꽂을 수 있다. 나머지 21개는 에이전트 자기보고 문자열 매칭이라 안 옮겼다.
#
# 라이선스가 코드 MIT / 데이터 CC BY 4.0 이라 재배포에 제한은 없지만, 여기엔
# 오라클 명령과 식별자만 남겼다. 페이로드 원문은 raw/redcode 에 그대로 있다.
#
# CC BY 4.0 표시 (Section 3(a)(1) 이행) — 이 줄들은 이 파일 사본과 함께 가야 한다.
#   RedCode Benchmark Dataset / Copyright (c) 2024 RedCode Authors (AI-secure)
#   https://github.com/AI-secure/RedCode
#   라이선스: 데이터 CC BY 4.0 https://creativecommons.org/licenses/by/4.0/ · 무보증
#             (평가 코드 쪽은 MIT — 위 오라클 요약이 그 코드에서 나왔다)
#   개작함: 27 인덱스 중 실상태 오라클 6 개만 요약. 이전 개작 없음.
#   전체 표시와 근거 조항은 저장소 루트 NOTICE 2 절.

