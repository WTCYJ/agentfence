  published: null
  backed: null
  why: >-
    조건 미성립. 이 형태로는 한 번도 안 쟀다. 지금 표의 두 줄(0/29 · 5/5)은
    서로 다른 프로브에서 왔고 프록시 유무 말고 스킴(TLS 대 평문)·설정(목록 없음
    대 목록 밖)·오라클(curl 종료코드 대 프록시 도달)·분모(30 대 12)까지 다르다.
    2026-08-20 에 axis 를 한 번 띄웠으나 C 팔 1 회차에서 429 로 끊겨 네 팔 모두
