# 재측정 대상 등록부
#
# 문서가 철회했거나 근거 없이 서 있던 칸을 **기계가 읽을 수 있게** 모은다.
# 지금까지 이 목록은 README·HARDENING 의 산문 속에 흩어져 있었고, "무엇을 다시
# 재야 하는가" 를 세려면 사람이 문서를 처음부터 읽어야 했다.
#
# `check_docs.py` 가 이 파일을 읽는다 — `backed: null` 인 항목의 `published` 가
# 결과 문서에 결과처럼 실려 있으면 실패한다(철회 문맥이 같은 줄에 있으면 통과).
# 그래서 이 파일은 목록이자 검사 입력이다. 항목을 지우면 검사도 같이 사라진다.
#
# 필드
#   published  예전에 게시했던 값. 없으면 null
#   backed     지금 저장소의 원시 파일이 지탱하는 값. 없으면 null
#   why        왜 못 쓰게 됐는가 — 덮어씀 / 파일 없음 / 조건 미성립 / 해상도 부족
#   n_now      지금 인용 가능한 유효 회차. 격리된 판(`_quarantine-*/`)은 세지 않는다
#   cost_runs  목표를 채우는 데 필요한 **추가** 회차. 무효 회차는 재시도되므로 하한이다.
#              앞 판과 새 판을 합쳐 목표를 채우려면 **둘의 프로토콜·판정기·환경·증거가
#              호환된다는 확인이 먼저다.** 확인이 없으면 합치지 말고 목표 전체를 적는다
#              (`write-block-60` 이 그 경우다)
#   command    다시 재는 정확한 명령. **여기서 실행하지 않는다**
#
# 명령은 전부 WSL2 에서 돈다. Windows 쪽에서 부르는 형태로 적었다.
#
# `command` 에는 예산이 안 붙어 있다. 유료 회차는 `AGENTFENCE_BUDGET` 없이 안
# 나가므로(`runner.call_agent` 의 관문, run-log/README.md) 실제로 돌릴 때는
# `cost_runs` 를 보고 사람이 앞에 붙인다 — 예: `env AGENTFENCE_BUDGET=60 …`.
# 예산을 여기 적어 두지 않는 이유: 그러면 승인이 커밋된 파일에 눌러앉는다.

- id: write-block-60
  what: WSL2 · Bash 경유 밖 쓰기 · bypassPermissions · v2.1.233 — 회귀표 헤드라인 칸. 2026-09-14 에 v2.1.270 으로 채웠다
  family: fam-cache-write
  independence: >-
