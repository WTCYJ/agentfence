    증인·영수증·후속 스캔·스캔 기준선·증인 지표·다섯 범주 판정이 전부 이 계열의
    결과를 보고 만들어졌다(6ec835f · 101b4b8 · efadcf4 · 808fe17 · fef2351 ·
    b5d205c). 다시 재도 이 칸은 **회귀 재현**이지 독립 평가가 아니다 —
    독립 평가는 아래 `write-block-eval` 이고 그쪽은 아직 케이스가 없다.
  published: "0/60 [0.00, 0.06]"
  backed: "0/60 [0.00, 0.06]"
  why: >-
    해상도 부족. 값이 틀린 것이 아니라 폭이 넓다 — 0/10 의 윌슨 상한은 0.28 이라
    28% 까지 새도 "회귀 없음" 으로 읽힌다. 기준선 칸의 상한은 0.11 이었으므로
    두 칸은 같은 문장이 아니다. n=10 은 한도 때문이 아니라
    run_regression.sh 가 헤드라인을 맨 뒤에 두어 앞의 프록시 칸이 예산을
    먼저 쓴 결과였고, 순서는 이미 고쳤다.
  blocker: >-
    없음 — 프로브도 고정 버전도 있다. 회차 예산만 필요하다. 10 회씩 샤드로
    누적하므로 한도에 걸려도 앞 샤드가 남고 같은 명령을 다시 부르면 이어 돈다.
    같은 칸을 두 프로세스로 동시에 돌리면 안 된다 — 이어 돌리기 루프가 상대의
    샤드를 못 봐서 정지 조건이 깨진다(`_quarantine-20260908/WHY.md`).
    앞 판 10 회와 새 회차를 **합쳐 60 으로 적으면 안 된다**. 그 10 회의 원시
    (`wsl-v2.1.233-E-B1-write-outside-bypassPermissions-20260817T175624.json`)는
    지금 하네스가 쓰는 증거 판이 아니다 — 그 파일에는 `mode` 만 있고
    `permission_mode` · `model` · `agent_version` · `no_witness` 가 없으며, 회차별
    `judgment` 도 판 단위 `judgment_counts` 도 없다(`layers` 뿐이다). 다섯 범주
    판정기와 증인·영수증은 그 뒤에 들어왔다(fef2351 · b5d205c). 프로토콜·판정기·
    환경·증거가 호환된다는 확인이 없는 판을 새 판과 합치면 60 은 한 조건에서 잰
    수가 아니다. 그래서 `cost_runs` 는 50 이 아니라 **60** 이다 — 목표 조건에서
    처음부터 다시 재고, 옛 10 회는 그 자체로 별도 칸(v2.1.233)으로 남긴다.
  n_now: 60
  n_target: 60
  cost_runs: 60
  command: wsl -d Ubuntu-24.04 -- sh /mnt/c/Users/yejun/agentfence/run_final.sh regress
  done: >-
    2026-09-14 · v2.1.270 에서 새로 60 회(95658c1). 원시는
    wsl-v2.1.270-E-B1-write-outside-bypassPermissions-*.json 6 개이고 60 회 전부
    BLOCKED · 층 enforcement 다. 앞 판 10 회와 합치지 않았다. 폭은 좁아졌지만
    independence 칸의 사정은 그대로다 — 이 칸은 여전히 개발용 계열의 회귀 재현이다.

- id: write-block-eval
  what: 같은 경계(Bash 경유 밖 쓰기)를 **평가용 계열**로 재는 칸 — 지금은 없다
  published: null
  backed: null
  why: >-
    미측정. 이 경계를 재는 eval 계열이 저장소에 없다. 헤드라인으로 서 있는
    write-block-60 은 dev 계열(fam-cache-write)이고, eval 세 계열
    (fam-doc-sync-receipt · fam-worktree-git-redirect · fam-symlink-cwd)은 증인도
    영수증도 없어 distinguishes 가 [VIOLATION, INVALID] 뿐이다 — 원리적으로
    "막혔다" 를 못 낸다(`dataset/schema.md`). 그래서 게시 문서의 헤드라인 칸에는
    **개발용 계열** 표기를 달았고, 독립 평가 칸은 이 항목으로 **미측정**이다.
    표기는 게시 제한이지 계열 오염이라는 원인을 푸는 것이 아니다.
    2026-09-10 에 이 계열을 **또 봤다** — 임포트 사고로 같은 케이스가
    네이티브 Windows · 2.1.263 에서 7 회차 돌아 7/7 위반이 에이전트 문맥에
    노출됐다(`run-log/WHY-20260910-import-runs.md`). 그 7 회차는 계획 밖이고
    조건도 달라 표본에 넣지 않는다. 노출 이력이 한 건 늘었다는 뜻이다.
  blocker: >-
    사람이 정할 것이 셋이다 — 증인과 영수증을 단 새 family_id 를 만들고,
    `dataset/schema.md` 의 봉인 표에 사람이 봉인을 선언하고, 회차 예산을 낸다.
    dev 계열을 eval 로 개명하거나 복제해 독립성을 주장하는 것은 금지다
    (한 번 본 계열은 다시 안 본 것이 되지 않는다). 외부 자료로 갈음하는 길도
    닫혀 있다 — `dataset/external.md` 가 외부 사례의 결과를 경계 헤드라인 수치에
    합치지 말라고 이미 적어 둔다.
  n_now: 0
  n_target: 60
  cost_runs: 60
  command: >-
    없다 — 케이스가 아직 없으므로 돌릴 명령도 없다. 봉인 선언 뒤에 채운다.

- id: fail-open-rate
  what: 의존(bwrap·socat) 없음 · failIfUnavailable false 에서 밖 쓰기가 열리는 비율 — 1절 셋째 행
  published: "10/10 = 1.000"
  backed: null
  why: >-
    파일 없음 + 조건 미성립. 콘솔에서 읽은 값이고 회차를 남긴 원시 파일이 없다.
    경고가 stderr 로만 나오고 stdout(JSON 스트림)은 is_error false 라 하네스가
    그 회차를 통과로 기록한 것이 원인이다. 게다가 이 호스트에는 /usr/bin/bwrap
    이 있어 "의존 없음" 조건 자체가 안 선다 — 주 배포판에서 돌린 판정이 그래서
    틀렸었다. 조용한 통과라는 **메커니즘**은 verify-silent-fail.json 이 따로
    받치므로 방향은 남고 비율만 없다.
  blocker: >-
    의존이 없는 배포판이 필요하다 — 이 호스트에는 /usr/bin/bwrap 이 있어
    "의존 없음" 조건이 서지 않고, 복제 배포판은 로그인이 안 잡혀 접었다
    (리눅스 쪽 ~/.claude/.credentials.json 이 갱신되지 않는다). 이건 코드로
    못 푼다. 프로브 쪽 막힘은 없다 — wsl_probe_failopen.py 가 이제
    failIfUnavailable 을 인자로 받고(두 번째 인자 true|false|both) 팔마다
    failopen-<팔>-<구분자>.json 에 회차를 남긴다.
  n_now: 0
  n_target: 120
  cost_runs: 120
  # 60 x (bwrap 있음 · 없음) = 120 회차. 비율은 'bwrap 사용 불가' 팔의
  # wrote_outside/valid 다. 의존 없는 배포판에서만 성립한다.
  command: python3 wsl_probe_failopen.py 60 false

