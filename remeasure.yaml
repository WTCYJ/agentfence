# ── 3절 2x3 표 · 경로 고지 축 — 게시 수치와 원본의 대조 목록 ──────────
#
# 이 일곱 칸은 `p-family.yaml` 의 `fam-path-cue` 가 "remeasure.yaml 에 아직
# 항목이 없다" 고 적어 둔 자리다. 그 말이 맞았고, 그래서 8 번 검사가 이 칸들을
# 한 번도 안 봤다 — 원시가 없는 값인데 등록이 없으면 애초에 감시 대상이 아니다.
# 3절은 이 저장소의 헤드라인 절인데 그 표가 검사 밖에 있었다.
#
# ## legacy_source_id 는 사후 자료 식별자이며 당시 run_id 가 아니다
#
# 아래 `legacy_source_id` 는 이 목록을 만들려고 2026-09-10 에 새로 부여한
# 이름이다. 그 회차가 쓰던 식별자가 아니다. 당시 하네스에는 `run_id` 도 장부도
# 없었다 — 장부(`run-log/`)는 그보다 뒤에 생겼다. 그러니 이 이름으로 원본을
# 되찾을 수는 없고, 이 목록 안에서 칸을 가리키는 용도뿐이다.
#
# 원본에 없는 실행 시각·모델 버전·설정·독립성을 여기서 만들어 채우지 않는다.
# 없는 칸은 `없음` 이고 왜 없는지 적는다.
#
# ## 두 갈래를 따로 적는다 — 합치면 구분이 사라진다
#
#   recompute_class   재계산 가능성 — 원시에서 k/n 을 다시 셀 수 있는가
#                     재계산가능 | 일부근거만확인 | 원본부재
#   condition_check   실행 조건 검증 가능성 — 그 회차가 어떤 에이전트 버전·설정·
#                     경로 접두사·세션에서 돌았는지를 파일로 확인할 수 있는가
#
# 이 둘은 다른 문제다. 비율을 다시 셀 수 있어도 조건을 모르면 무엇의 비율인지
# 모르고, 조건을 알아도 원시가 없으면 셀 것이 없다. 한 칸으로 합치면 "재계산
# 가능" 이 "조건까지 안다" 로 읽힌다.
#
# ## 추적 사슬 — 게시 수치에서 분석 코드까지
#
#   source_file    원본 파일과 sha256. 없으면 `없음` + 왜 없는지
#   record_locus   그 파일 안의 레코드 위치. 원본이 없으면 `없음`
#   aggregation    집계 조건 — 무엇을 무엇으로 합쳤나
#   analysis_code  그 값을 낸 분석 코드의 커밋
#
# 일곱 칸 모두 `source_file: 없음` 이다. 디스크 전역과 git 이력 전체를 훑어
# 확인했다 — `modelaxis-*.json` · `pathnaming-*.json` 은 한 번도 커밋된 적이
# 없고(`git log --diff-filter=A`), 지금 디스크에도 0 건이다. 두 프로브는
# 2026-09-10 에 결과 파일을 쓰게 고쳐졌으나 고친 뒤로 안 돌았다.
#
# ## 값 문자열은 유일 식별자가 아니다
#
# 고지 조건의 `haiku`·`opus` 차단 칸(`0/18`)은 등록하지 않았다. 같은 문자열이
# T3 우회 탐색의 `0/18` 과 겹치는데 그쪽은 원시가 있다(`wsl-T3-route-around-*.json`).
# 등록하면 그 일곱 자리가 전부 철회 위반으로 잡힌다 — 검사기가 오탐을 내면 사람이
# 검사를 안 믿는다. 그 칸은 같은 줄의 `53/82` 가 끌고 가므로 표기는 붙는다.
# 값 단위 감시의 한계이고, 칸 단위 꼬리표(`<!-- cell: -->`)가 있어야 풀린다.

